name: AnyDrag
options:
  bundleIdPrefix: com.anydrag
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: "0.3.4"

schemes:
  AnyDrag:
    build:
      targets:
        AnyDrag: all

targets:
  AnyDrag:
    type: application
    platform: macOS
    sources:
      - AnyDrag/Sources
      - AnyDrag/Assets.xcassets
      - AnyDrag/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xueshi.anydrag
        INFOPLIST_FILE: AnyDrag/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnyDrag/AnyDrag.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Version scheme migrated to CalVer (YY.MM.<build>) to align with
        # HyperCapslock. CURRENT_PROJECT_VERSION jumped 12 → 99 in a one-time
        # prep so the next bump-version.sh run produces build 100 →
        # MARKETING_VERSION "26.05.100". After that, both fields are written by
        # bump-version.sh at release time; don't hand-edit.
        MARKETING_VERSION: "26.07.113"
        CURRENT_PROJECT_VERSION: "113"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 584KQTRF3B
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: me.xueshi.anydrag.debug
          PRODUCT_NAME: AnyDrag-Debug
    dependencies:
      - package: Sparkle
      - package: Aptabase
        product: Aptabase
