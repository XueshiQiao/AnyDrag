name: CodeQL

# Static security analysis of the Swift sources.
#
# Why this can't use GitHub's one-click "Default setup": AnyDrag's
# `.xcodeproj` is generated by XcodeGen and gitignored, so there is no Xcode
# project in the repo for the automatic scanner to find. Swift therefore
# needs `build-mode: manual` with an explicit `xcodegen generate` first.
#
# Swift analysis only runs on macOS runners -- this cannot move to Linux.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly re-scan so newly published CodeQL queries get applied to code
    # that hasn't changed. Monday 03:00 UTC.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      # Deliberately leaner than build.yml's release build: single arch,
      # Debug, no signing/notarization/DMG. CodeQL only needs to observe the
      # compiler invocations, and none of that requires the Apple secrets.
      - name: Build for analysis
        run: |
          xcodebuild -project AnyDrag.xcodeproj \
            -scheme AnyDrag \
            -configuration Debug \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
