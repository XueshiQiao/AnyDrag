name: Build and Notarize macOS App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    env:
      HAS_APPLE_SECRETS: ${{ secrets.MAC_CERTS_P12_BASE64 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install Build Tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Apple Certificate
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build App
        run: |
          xcodebuild -project AnyDrag.xcodeproj \
            -scheme AnyDrag \
            -configuration Release \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            SYMROOT=$(PWD)/build

      - name: Sign App
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        run: |
          codesign --force --options runtime --sign "Developer ID Application" --timestamp --entitlements AnyDrag/AnyDrag.entitlements build/Release/AnyDrag.app

      - name: Create DMG
        run: |
          cd build/Release
          create-dmg \
            --volname "AnyDrag" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AnyDrag.app" 150 190 \
            --hide-extension "AnyDrag.app" \
            --app-drop-link 450 190 \
            "AnyDrag.dmg" \
            "AnyDrag.app"

      - name: Sign DMG
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        run: |
          cd build/Release
          codesign --force --sign "Developer ID Application" --timestamp AnyDrag.dmg

      - name: Notarize DMG
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          cd build/Release
          xcrun notarytool submit AnyDrag.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait

      - name: Staple Ticket to DMG
        if: ${{ env.HAS_APPLE_SECRETS == 'true' }}
        run: |
          cd build/Release
          xcrun stapler staple AnyDrag.dmg

      - name: Sign Update with Sparkle EdDSA
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          # Resolve the Sparkle binary path from SPM build artifacts
          SPARKLE_BIN=$(find ~/Library/Developer/Xcode/DerivedData -path "*/SourcePackages/artifacts/sparkle/Sparkle/bin" -maxdepth 6 2>/dev/null | head -1)
          if [ -z "$SPARKLE_BIN" ]; then
            # Fallback: download sign_update from Sparkle release
            curl -sL "https://github.com/sparkle-project/Sparkle/releases/latest/download/Sparkle-2.7.5.tar.xz" -o /tmp/sparkle.tar.xz
            mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
            SPARKLE_BIN="/tmp/sparkle/bin"
          fi

          SIGNATURE=$("$SPARKLE_BIN/sign_update" build/Release/AnyDrag.dmg --ed-key-file <(echo "$SPARKLE_EDDSA_KEY") | grep "sparkle:edSignature=" | sed 's/.*sparkle:edSignature="\(.*\)".*/\1/')
          FILESIZE=$(stat -f%z build/Release/AnyDrag.dmg)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${{ env.MARKETING_VERSION || '1.2.0' }}

          # Read version from project.yml
          VERSION=$(grep 'MARKETING_VERSION' project.yml | head -1 | sed 's/.*: *"\(.*\)"/\1/')
          BUILD=$(grep 'CURRENT_PROJECT_VERSION' project.yml | head -1 | sed 's/.*: *"\(.*\)"/\1/')
          PUBDATE=$(date -R)

          echo "SPARKLE_SIG=$SIGNATURE" >> $GITHUB_ENV
          echo "SPARKLE_SIZE=$FILESIZE" >> $GITHUB_ENV
          echo "SPARKLE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "SPARKLE_BUILD=$BUILD" >> $GITHUB_ENV
          echo "SPARKLE_TAG=$TAG_NAME" >> $GITHUB_ENV
          echo "SPARKLE_DATE=$PUBDATE" >> $GITHUB_ENV

      - name: Update Appcast
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_SPARKLE_KEY == 'true' }}
        run: |
          ITEM="    <item>\n      <title>Version ${{ env.SPARKLE_VERSION }}</title>\n      <sparkle:version>${{ env.SPARKLE_BUILD }}</sparkle:version>\n      <sparkle:shortVersionString>${{ env.SPARKLE_VERSION }}</sparkle:shortVersionString>\n      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>\n      <pubDate>${{ env.SPARKLE_DATE }}</pubDate>\n      <enclosure\n        url=\"https://github.com/XueshiQiao/AnyDrag/releases/download/${{ env.SPARKLE_TAG }}/AnyDrag.dmg\"\n        length=\"${{ env.SPARKLE_SIZE }}\"\n        type=\"application/octet-stream\"\n        sparkle:edSignature=\"${{ env.SPARKLE_SIG }}\"\n      />\n    </item>"

          # Insert new item at placeholder
          sed -i '' "s|<!-- SPARKLE_ITEM_PLACEHOLDER -->|<!-- SPARKLE_ITEM_PLACEHOLDER -->\n${ITEM}|" appcast.xml

          # Commit and push updated appcast
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${{ env.SPARKLE_TAG }}"
          git push origin HEAD:main

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyDrag-macOS
          path: build/Release/AnyDrag.dmg

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/Release/AnyDrag.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
