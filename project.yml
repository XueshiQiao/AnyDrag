name: AnyDrag
options:
  bundleIdPrefix: com.anydrag
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

schemes:
  AnyDrag:
    build:
      targets:
        AnyDrag: all

targets:
  AnyDrag:
    type: application
    platform: macOS
    sources:
      - AnyDrag/Sources
      - AnyDrag/Assets.xcassets
      - AnyDrag/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xueshi.anydrag
        INFOPLIST_FILE: AnyDrag/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnyDrag/AnyDrag.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "10"
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 584KQTRF3B
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: me.xueshi.anydrag.debug
          PRODUCT_NAME: AnyDrag-Debug
    dependencies:
      - package: Sparkle
